[workspace]
resolver = "2"
members = ["crates/*", "crates/orchestrator-gui/src-tauri"]
# `crates/orchestrator-gui` is the Tauri *frontend* root (package.json, Vite,
# SvelteKit); its Rust manifest lives one level deeper in `src-tauri/`, listed
# above. The `crates/*` glob still matches the directory itself, so it has to
# be excluded explicitly or Cargo errors on the missing manifest.
exclude = ["crates/orchestrator-gui"]

[workspace.dependencies]
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "global_shortcuts"] }
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
thiserror = { version = "2" }
zbus = { version = "5.18" }
tokio = { version = "1", features = ["sync"] }
tracing = { version = "0.1" }
