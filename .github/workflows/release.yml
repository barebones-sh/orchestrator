name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  check-version:
    name: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify tag matches orchestrator-cli's Cargo.toml version
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CRATE_VERSION="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c "import json,sys; data=json.load(sys.stdin); pkg=next(p for p in data['packages'] if p['name']=='orchestrator-cli'); print(pkg['version'])")"
          echo "tag version:   $TAG_VERSION"
          echo "crate version: $CRATE_VERSION"
          if [ "$TAG_VERSION" != "$CRATE_VERSION" ]; then
            echo "::error::Pushed tag v$TAG_VERSION does not match orchestrator-cli's Cargo.toml version ($CRATE_VERSION). Update Cargo.toml or fix the tag before releasing."
            exit 1
          fi

  package:
    name: package (${{ matrix.name }})
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-deb
        run: cargo install cargo-deb --version 3.7.0 --locked

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p orchestrator-cli

      - name: Build .deb package
        run: cargo deb -p orchestrator-cli --target ${{ matrix.target }} --no-build

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: deb-${{ matrix.name }}
          path: target/${{ matrix.target }}/debian/*.deb

  publish:
    name: publish
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download all package artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: "deb-*"
          merge-multiple: true

      - name: Create release and upload packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "${{ github.ref_name }}" --generate-notes dist/*.deb
