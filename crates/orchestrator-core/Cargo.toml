[package]
name = "orchestrator-core"
version = "0.1.0"
edition = "2021"

# Feature-forwarding only -- orchestrator-core itself has no platform code of
# its own (see lib.rs's doc comment). These exist so `orchestrator-cli`'s and
# `orchestrator-gui`'s `[target.'cfg(...)'.dependencies]` blocks (design spec
# §4) can request real backends transitively via
# `orchestrator-core = { features = ["kde", "wayland"] }` without also having
# to enumerate the three trait crates' own feature names themselves. None of
# these are in `default`, so `orchestrator-core`'s own default dependency
# resolution (and `cargo tree -p orchestrator-core -e normal`) stays free of
# `zbus`/`ashpd`/`tokio`.
[features]
default = []
kde = ["orchestrator-hotkey/kde", "orchestrator-window/kde"]
wayland = ["orchestrator-input/wayland"]
macos = ["orchestrator-hotkey/macos", "orchestrator-window/macos", "orchestrator-input/macos"]
runner = ["dep:tokio", "dep:tracing"]

[dependencies]
serde = { workspace = true }
serde_json = "1"
thiserror = { workspace = true }
dirs = "5"
fastrand = "2"
orchestrator-hotkey = { path = "../orchestrator-hotkey", default-features = false }
orchestrator-input  = { path = "../orchestrator-input",  default-features = false }
orchestrator-window = { path = "../orchestrator-window", default-features = false }
tokio = { workspace = true, optional = true, features = ["sync", "rt-multi-thread", "macros", "time"] }
tracing = { workspace = true, optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
